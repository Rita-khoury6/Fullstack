<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUESS THE NUM GAME </title>
    <link href="styles.css"  type="text/css" rel="stylesheet">
</head>
<body>
     <header class="heade1"> 
        <h2>GUESS THE NUMBER</h2>
<button class="helpbtn">
    How to Play</button></header>
    <div class="G1">
   
    <input type="number" id="numinput" placeholder="Guess the Number"><br/>
    <button id="btnid">Check</button>
     <button id="Reset">Reset</button>
    <p id="Message">  </p>
      <p>
        Attemps:
        <span id="Attemps">5</span>
      </p>
     </div>
    
<div class="modal hidden">
  <button class="btn-close">&times;</button>
  <h2>How to Play </h2>
  <p>1. Guess a number From 1 to 10</p>
  <p>2. You have 5 attempts to get it right.</p>
  <p>3. You can press Enter or click Check to test your guess.</p>
</div>
<div class="overlay hidden"></div>
    <script src="app.js"></script>
   
</body>
</html>
