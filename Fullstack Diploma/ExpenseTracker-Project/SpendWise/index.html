<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense-Tracker
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  
    <nav class="nav1" >
         <div class= "container">
           <h2>SpendWise</h2>
             <span class="nav-text">
            Your personal expense tracker
        </span>
        <div class="form-buttons">
       <a href="#add-expense" class="add-btn">Add Expense</a>
       
    </div>
         </div>
         </nav>

        <main class="container2">
    <section>
    <h1>My Expenses</h1>
    <p>Keep track of where your money goes.</p>
     </section>
    <div class="contentg">
    <div class="summary-cards">

        <div class="total-card2">
            <h3>Total Spent</h3>
            <p id="totalSpent">0.00</p>
        </div>
        <div class="expense-card2">
            <h3>Number of Expenses</h3>
            <p id="expensesCount">0</p>
        </div>
        <div class="Maxexpense-card2">
             <h3>Biggest Expense</h3>
              <p id="biggestExpense">0.00</p>
        </div>
        </div>
        <section id="add-expense"  class="form1">
             <form method="get" id="expenseForm">
            <fieldset>
                <legend>Add Expense</legend>
               <label for="descr">Description</label>
           <input type="text" name="description" id="descr">
                 <p id="descriptionmess"></p>
           <label for="date">Date</label>
           <input type="date" name="date" id="date">
               <p id="datemess"></p>
           <label for="Amount">Amount of Money</label>
           <input type="number" name="Amount" id="Amount"   placeholder="Enter amount"> 
              <p id="amountmess"></p>
           <label for="method">Payment Method </label>
           <select name ="Payment Method" id="method">
              <option value="">Choose payment method</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select> 
           

             <label for="Category">Category</label>   
           <select name="category" id="category">
             <option value="">Choose a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
                    </select>
           <p id="Categorymess"></p>
          <label for="note">Notes</label>
              <textarea name="notes" id="note"placeholder="Add extra details (optional)"
               rows="3" >
                 </textarea>
                <button id="reset-btn">Reset</button><button type="submit">Add Expense</button>
                 </fieldset>
                   
            </form>
        
        </section>
  


<section class="expenses-section">

    <h2>Recent Expenses</h2>
    <p>View and manage your expenses.</p>

    <!-- Filter and Sort -->
    <div class="table-controls">

        <div>
            <label for="categoryFilter">Filter by Category</label>
            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
            </select>
        </div>

     <div>
            <label for="sortAmount">Sort by Amount</label>
            <select id="sortAmount">
                <option value="default">Default</option>
                <option value="high-low">Highest to Lowest</option>
                <option value="low-high">Lowest to Highest</option>
            </select>
     </div>
    </div>
    <div class="table-responsive">
        <table class="expenses-table">
        <thead>
        <tr>
         <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
    </tr>
     </thead>
     <tbody id="expensesTableBody">

     </tbody>
      
        </table>

      </div>

    <p id="emptyState">No expenses yet</p>

</section>
</div>
</main>
   






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
 <script src="app.js" ></script>
</body>
</html>
